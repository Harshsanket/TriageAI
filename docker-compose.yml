name: triageai

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: triageai-postgres
    profiles: [core, queue, ai, llm, observ]
    environment:
      POSTGRES_USER: triageai
      POSTGRES_PASSWORD: triageai
      POSTGRES_DB: triageai
    ports:
      - '${TRIAGEAI_BIND:-127.0.0.1}:5432:5432'
    volumes:
      - triageai-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U triageai -d triageai']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: triageai-redis
    # `storage` also starts Redis so the Redis cache adapter works alongside
    # MinIO (`docker compose --profile core --profile storage up -d`).
    profiles: [queue, storage]
    ports:
      - '${TRIAGEAI_BIND:-127.0.0.1}:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible blob storage for `capabilities.blobStore.adapter: s3`
  # (18.T12). The API creates the bucket on first put; console at :9001.
  # Docker Hub's official minio/minio repository was removed in 2025; this
  # maintained MinIO community build is API-compatible with the MinIO SDK.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: triageai-minio
    profiles: [storage]
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-triageai}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-triageai-dev-secret}
    ports:
      - '${TRIAGEAI_BIND:-127.0.0.1}:9000:9000'
      - '${TRIAGEAI_BIND:-127.0.0.1}:9001:9001'
    volumes:
      - triageai-minio:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: triageai/api:dev
    container_name: triageai-api
    restart: unless-stopped
    profiles: [core, queue, ai, llm]
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://triageai:triageai@postgres:5432/triageai
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8000}
      # Unset = chosen in the /config wizard (or production default). Set it to pin.
      AUTH_MODE: ${AUTH_MODE:-}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # Optional OTLP/HTTP trace export; set to http://otel-collector:4318 with
      # the observ profile. Empty keeps the exporter off (the default).
      TRIAGEAI_OTLP_ENDPOINT: ${TRIAGEAI_OTLP_ENDPOINT:-}
      # 32+ chars; enables the encrypted secret store used by /config.
      TRIAGEAI_SECRET_KEY: ${TRIAGEAI_SECRET_KEY:-}
      # Phase 23.7: generated master.key lives here (mode 600), outside the DB.
      TRIAGEAI_SECRETS_DIR: /data/secrets
      TRIAGEAI_UPDATE_DIR: /data/updates
      TRIAGEAI_UPDATE_ROOT: ${TRIAGEAI_UPDATE_ROOT:-}
      TRIAGEAI_UPDATE_COMMAND: ${TRIAGEAI_UPDATE_COMMAND:-}
      # Exit after the wizard applies so `restart:` boots the new config.
      TRIAGEAI_RESTART_ON_APPLY: '1'
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      # Behind nginx: trust only the compose network for X-Forwarded-For (R3).
      TRIAGEAI_TRUST_PROXY: ${TRIAGEAI_TRUST_PROXY:-loopback, linklocal, uniquelocal}
      TRIAGEAI_GENERATOR_BASE_URL: ${TRIAGEAI_GENERATOR_BASE_URL:-http://ollama:11434}
      TRIAGEAI_CONFIG: ${TRIAGEAI_CONFIG:-/app/triage.config.json}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      # Phase 12: signed plugins hot-load from this volume; `off` = bundled only.
      TRIAGEAI_PLUGINS_DIR: /plugins
      TRIAGEAI_PLUGIN_REGISTRY: ${TRIAGEAI_PLUGIN_REGISTRY:-off}
      TRIAGEAI_PLUGIN_PUBLIC_KEYS: ${TRIAGEAI_PLUGIN_PUBLIC_KEYS:-}
      # Phase 18.T11/T12: env named by capabilities.cache/blobStore. The
      # storage profile starts Redis + MinIO with these defaults; memory and
      # filesystem adapters ignore them.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      TRIAGEAI_S3_ENDPOINT: ${TRIAGEAI_S3_ENDPOINT:-http://minio:9000}
      TRIAGEAI_S3_ACCESS_KEY: ${TRIAGEAI_S3_ACCESS_KEY:-triageai}
      TRIAGEAI_S3_SECRET_KEY: ${TRIAGEAI_S3_SECRET_KEY:-triageai-dev-secret}
      # Filesystem blob root when capabilities.blobStore.adapter=filesystem.
      TRIAGEAI_BLOB_ROOT: ${TRIAGEAI_BLOB_ROOT:-/data/blobs}
    networks:
      - default
      - modules
    volumes:
      - triageai-plugins:/plugins
      - triageai-secrets:/data/secrets
      - triageai-updates:/data/updates
      - triageai-blobs:/data/blobs
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '${TRIAGEAI_BIND:-127.0.0.1}:3000:3000'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://localhost:3000/readyz\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: triageai/web:dev
    container_name: triageai-web
    profiles: [core, queue, ai, llm]
    depends_on:
      - api
    ports:
      - '${TRIAGEAI_BIND:-127.0.0.1}:5173:80'

  ai-service:
    build:
      context: .
      dockerfile: docker/ai-service.Dockerfile
    image: triageai/ai-service:dev
    container_name: triageai-ai-service
    profiles: [ai, llm]
    environment:
      ARTIFACTS_DIR: ${ARTIFACTS_DIR:-/artifacts}
    ports:
      - '${TRIAGEAI_BIND:-127.0.0.1}:8000:8000'
    volumes:
      - triageai-hf-cache:/models
      - triageai-artifacts:/artifacts

  trainer:
    build:
      context: .
      dockerfile: docker/trainer.Dockerfile
    image: triageai/trainer:dev
    container_name: triageai-trainer
    profiles: [train]
    environment:
      TRIAGEAI_API_URL: ${TRIAGEAI_API_URL:-http://api:3000}
      ARTIFACTS_DIR: /artifacts
      HF_HOME: /models
    volumes:
      - triageai-hf-cache:/models
      - triageai-artifacts:/artifacts
    depends_on:
      - api

  echo-module:
    build:
      context: .
      dockerfile: docker/echo-module.Dockerfile
    image: triageai/module-echo:dev
    container_name: triageai-module-echo
    profiles: [modules]
    environment:
      TRIAGEAI_MP1_PORT: '8080'
      TRIAGEAI_MP1_REQUIRE_SESSION: ${TRIAGEAI_MP1_REQUIRE_SESSION:-0}
      TRIAGEAI_CORE_PUBLIC_KEY: ${TRIAGEAI_CORE_PUBLIC_KEY:-}
      TRIAGEAI_SESSION_PUBLIC_KEY: ${TRIAGEAI_SESSION_PUBLIC_KEY:-}
      TRIAGEAI_SESSION_GENERATION: ${TRIAGEAI_SESSION_GENERATION:-}
    expose:
      - '8080'
    networks:
      - modules

  slack-module:
    build:
      context: .
      dockerfile: docker/integrations-slack.Dockerfile
    image: triageai/module-integrations-slack:dev
    container_name: triageai-module-slack
    profiles: [modules]
    environment:
      TRIAGEAI_MP1_PORT: '8080'
      DATABASE_URL: postgres://mod_integrations_slack@postgres:5432/triageai
      TRIAGEAI_MP1_REQUIRE_SESSION: ${TRIAGEAI_MP1_REQUIRE_SESSION:-0}
      TRIAGEAI_CORE_PUBLIC_KEY: ${TRIAGEAI_CORE_PUBLIC_KEY:-}
      TRIAGEAI_SESSION_PUBLIC_KEY: ${TRIAGEAI_SESSION_PUBLIC_KEY:-}
      TRIAGEAI_SESSION_GENERATION: ${TRIAGEAI_SESSION_GENERATION:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    expose:
      - '8080'
    networks:
      - modules
    depends_on:
      postgres:
        condition: service_healthy

  chat-module:
    build:
      context: .
      dockerfile: docker/chat-module.Dockerfile
    image: triageai/module-chat:dev
    container_name: triageai-module-chat
    profiles: [modules]
    environment:
      TRIAGEAI_MP1_PORT: '8080'
      DATABASE_URL: postgres://mod_chat@postgres:5432/triageai
      TRIAGEAI_MP1_REQUIRE_SESSION: ${TRIAGEAI_MP1_REQUIRE_SESSION:-0}
      TRIAGEAI_CORE_PUBLIC_KEY: ${TRIAGEAI_CORE_PUBLIC_KEY:-}
      TRIAGEAI_SESSION_PUBLIC_KEY: ${TRIAGEAI_SESSION_PUBLIC_KEY:-}
      TRIAGEAI_SESSION_GENERATION: ${TRIAGEAI_SESSION_GENERATION:-}
    expose:
      - '8080'
    networks:
      - modules
    depends_on:
      postgres:
        condition: service_healthy

  ollama:
    image: ollama/ollama:0.40.12
    container_name: triageai-ollama
    profiles: [llm]
    ports:
      - '${TRIAGEAI_BIND:-127.0.0.1}:11434:11434'
    volumes:
      - triageai-ollama:/root/.ollama

  # Observability stack. Run with `--profile core --profile observ` so the api
  # service is scraped and can export OTLP traces to the collector.
  prometheus:
    image: prom/prometheus:v3.7.2
    container_name: triageai-prometheus
    profiles: [observ]
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus-rules.yml:/etc/prometheus/rules/triageai.yml:ro
    ports:
      - '${TRIAGEAI_BIND:-127.0.0.1}:9090:9090'

  grafana:
    image: grafana/grafana:12.3.0
    container_name: triageai-grafana
    profiles: [observ]
    depends_on:
      - prometheus
    volumes:
      - ./docker/grafana-datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
    ports:
      - '${TRIAGEAI_BIND:-127.0.0.1}:3310:3000'

  alertmanager:
    image: prom/alertmanager:v0.35.0
    container_name: triageai-alertmanager
    profiles: [observ]
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    volumes:
      - ./docker/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - triageai-alertmanager:/alertmanager
    ports:
      - '${TRIAGEAI_BIND:-127.0.0.1}:9093:9093'

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    container_name: triageai-otel-collector
    profiles: [observ]
    command: ['--config=/etc/otelcol-contrib/config.yml']
    depends_on:
      - tempo
    volumes:
      - ./docker/otel-collector-config.yml:/etc/otelcol-contrib/config.yml:ro
    ports:
      - '${TRIAGEAI_BIND:-127.0.0.1}:4317:4317'
      - '${TRIAGEAI_BIND:-127.0.0.1}:4318:4318'

  loki:
    image: grafana/loki:3.7.9
    container_name: triageai-loki
    profiles: [observ]
    command: ['-config.file=/etc/loki/loki-config.yml']
    volumes:
      - ./docker/loki-config.yml:/etc/loki/loki-config.yml:ro
      - triageai-loki:/loki
    ports:
      - '${TRIAGEAI_BIND:-127.0.0.1}:3100:3100'

  tempo:
    image: grafana/tempo:2.9.5
    container_name: triageai-tempo
    profiles: [observ]
    command: ['-config.file=/etc/tempo/tempo-config.yml']
    volumes:
      - ./docker/tempo-config.yml:/etc/tempo/tempo-config.yml:ro
      - triageai-tempo:/var/tempo
    ports:
      - '${TRIAGEAI_BIND:-127.0.0.1}:3200:3200'

networks:
  modules:
    internal: true

volumes:
  triageai-updates:
  triageai-secrets:
  triageai-pgdata:
  triageai-hf-cache:
  triageai-artifacts:
  triageai-ollama:
  triageai-plugins:
  triageai-blobs:
  triageai-minio:
  triageai-alertmanager:
  triageai-loki:
  triageai-tempo:
