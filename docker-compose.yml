name: triageai

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: triageai-postgres
    profiles: [core, queue, ai, llm, observ]
    environment:
      POSTGRES_USER: triageai
      POSTGRES_PASSWORD: triageai
      POSTGRES_DB: triageai
    ports:
      - '5432:5432'
    volumes:
      - triageai-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U triageai -d triageai']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: triageai-redis
    profiles: [queue]
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: triageai/api:dev
    container_name: triageai-api
    profiles: [core, queue, ai, llm]
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://triageai:triageai@postgres:5432/triageai
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8000}
      TRIAGEAI_GENERATOR_BASE_URL: ${TRIAGEAI_GENERATOR_BASE_URL:-http://ollama:11434}
      TRIAGEAI_CONFIG: ${TRIAGEAI_CONFIG:-/app/triage.config.json}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '3000:3000'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://localhost:3000/readyz\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: triageai/web:dev
    container_name: triageai-web
    profiles: [core, queue, ai, llm]
    depends_on:
      - api
    ports:
      - '5173:80'

  ai-service:
    build:
      context: .
      dockerfile: docker/ai-service.Dockerfile
    image: triageai/ai-service:dev
    container_name: triageai-ai-service
    profiles: [ai, llm]
    environment:
      ARTIFACTS_DIR: ${ARTIFACTS_DIR:-/artifacts}
    ports:
      - '8000:8000'
    volumes:
      - triageai-hf-cache:/models
      - triageai-artifacts:/artifacts

  trainer:
    build:
      context: .
      dockerfile: docker/trainer.Dockerfile
    image: triageai/trainer:dev
    container_name: triageai-trainer
    profiles: [train]
    environment:
      TRIAGEAI_API_URL: ${TRIAGEAI_API_URL:-http://api:3000}
      ARTIFACTS_DIR: /artifacts
      HF_HOME: /models
    volumes:
      - triageai-hf-cache:/models
      - triageai-artifacts:/artifacts
    depends_on:
      - api

  ollama:
    image: ollama/ollama:latest
    container_name: triageai-ollama
    profiles: [llm]
    ports:
      - '11434:11434'
    volumes:
      - triageai-ollama:/root/.ollama

  prometheus:
    image: prom/prometheus:v3.7.2
    container_name: triageai-prometheus
    profiles: [observ]
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - '9090:9090'

  grafana:
    image: grafana/grafana:12.3.0
    container_name: triageai-grafana
    profiles: [observ]
    depends_on:
      - prometheus
    volumes:
      - ./docker/grafana-datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
    ports:
      - '3310:3000'

volumes:
  triageai-pgdata:
  triageai-hf-cache:
  triageai-artifacts:
  triageai-ollama:
