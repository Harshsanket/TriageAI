packages:
  - 'apps/*'
  - 'packages/*'
  - 'modules/*'

# pnpm 12 blocks dependency build scripts by default. esbuild (via Vite)
# needs its postinstall to install the correct platform binary.
allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - '@vitest/mocker@5.1.0'
  - '@vitest/spy@5.1.0'
  - vitest@5.1.0
