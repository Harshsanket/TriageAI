name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript:
    name: TypeScript (lint, typecheck, test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: triageai
          POSTGRES_PASSWORD: triageai
          POSTGRES_DB: triageai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U triageai -d triageai"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://triageai:triageai@localhost:5432/triageai
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test:ts

  ai-contract:
    name: Node/Python AI contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'
      - run: pnpm install --frozen-lockfile
      - name: Install ai-service deps
        working-directory: apps/ai-service
        run: uv sync --extra dev
      - name: Start ai-service
        working-directory: apps/ai-service
        run: |
          uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/ai-service.log 2>&1 &
          for i in $(seq 1 120); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/readyz || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          test "$code" = "200" || { cat /tmp/ai-service.log; exit 1; }
      - run: RUN_AI_CONTRACT_TESTS=1 AI_SERVICE_URL=http://127.0.0.1:8000 pnpm --filter @triageai/api exec vitest run test/ai.contract.test.ts

  python:
    name: Python (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'
      - run: uv sync --extra dev
      - run: uv run pytest

  classification-eval:
    name: Classification eval (gates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'
      - name: Install ai-service deps
        working-directory: apps/ai-service
        run: uv sync --extra dev
      - name: Run eval (macro-F1, p95, false auto-routing gates)
        working-directory: apps/ai-service
        run: uv run python -m eval.run_eval
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: classification-eval-reports
          path: apps/ai-service/eval/reports/

  retrieval-eval:
    name: Retrieval eval (recall@3 / MRR)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: triageai
          POSTGRES_PASSWORD: triageai
          POSTGRES_DB: triageai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U triageai -d triageai"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://triageai:triageai@localhost:5432/triageai
      AI_SERVICE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'
      - run: pnpm install --frozen-lockfile
      - name: Install ai-service deps + start it
        working-directory: apps/ai-service
        run: |
          uv sync --extra dev
          uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/ai-service.log 2>&1 &
          for i in $(seq 1 120); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/readyz || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          test "$code" = "200" || { cat /tmp/ai-service.log; exit 1; }
      - name: Run retrieval eval (recall@3 gate 0.8)
        run: pnpm --filter @triageai/api exec tsx evals/retrieval.eval.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrieval-eval-report
          path: apps/api/evals/reports/

  docker-smoke:
    name: Docker Compose (build + boot + curl smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --profile core build
      - name: Boot core profile
        run: docker compose --profile core up -d
      - name: 'Smoke: readyz, manifest, echo workflow e2e'
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/readyz || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          test "$code" = "200" || { docker compose logs api; exit 1; }
          curl -sf http://localhost:3000/api/v1/system/manifest | grep -q '"id":"echo"'
          curl -fs -X POST http://localhost:3000/api/v1/echo/run \
            -H 'content-type: application/json' -d '{"text":"ci smoke"}' > /tmp/run.json
          RUN_ID=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("/tmp/run.json","utf8")).runId)')
          sleep 3
          curl -sf "http://localhost:3000/api/v1/echo/runs?limit=5" | grep -q "\"id\":\"$RUN_ID\",\"status\":\"SUCCEEDED\"" || false
          curl -sf -o /dev/null -w "\nweb=%{http_code}\n" http://localhost:5173/
      - name: Tear down
        if: always()
        run: docker compose --profile core down -v
