# Prometheus scrape config for the `observ` compose profile.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: triageai-api
    metrics_path: /metrics
    # With AUTH_MODE=required, /metrics needs METRICS_TOKEN as a bearer token:
    # authorization:
    #   credentials: <same value as METRICS_TOKEN>
    static_configs:
      - targets: ['api:3000']
