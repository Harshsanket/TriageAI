# Prometheus scrape config for the `observ` compose profile.
global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: triageai-api
    metrics_path: /metrics
    # With AUTH_MODE=required, /metrics needs METRICS_TOKEN as a bearer token:
    # authorization:
    #   credentials: <same value as METRICS_TOKEN>
    static_configs:
      - targets: ['api:3000']
