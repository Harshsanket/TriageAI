# SPA fallback + proxy API; the host serves module bundles (ADR-0007).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Phase 21 (R10): CSP allows only our bundle plus the exact pre-paint script.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-EJFONL2tszoS4TNTHWzjuczFEhpYeFEvFheWsSyeqqA='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;

  location = /healthz {
    access_log off;
    return 200 'web-ok\n';
  }

  # Model downloads stream progress as server-sent events: no buffering.
  location = /api/v1/setup/models/pull {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  location /api {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Plugin web bundles and the OpenAI-compatible API live on the API host (R6).
  location /plugins/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /v1/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri /index.html;
  }
}
