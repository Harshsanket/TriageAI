# OpenTelemetry collector for the `observ` profile (Phase 18.4/18.T5).
# Receives OTLP/HTTP from the API (TRIAGEAI_OTLP_ENDPOINT=http://otel-collector:4318),
# batches spans, and forwards them to Tempo. `debug` keeps a readable copy in
# the collector log while the pipeline is being set up.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024

exporters:
  debug:
    verbosity: basic
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo, debug]
